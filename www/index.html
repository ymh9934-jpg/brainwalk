<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매일 두뇌 산책</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF7EC; --ink:#2A211A; --soft:#6B5A4C; --line:#EADBC8;
  --green:#2F6E50; --green-d:#1F4D37; --green2:#3F8A66; --coral:#C8552F; --cream:#FBF4EA;
  --gold:#E3A92B; --gold-l:#FFE9B8; --mint:#E6F2EA;
  --fs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;touch-action:manipulation}
body{font-size:calc(21px * var(--fs));line-height:1.5}
button{font-family:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;color:var(--ink)}
#app{max-width:560px;margin:0 auto;padding:20px 16px 36px;min-height:100vh;display:flex;flex-direction:column}

.date{font-size:1em;color:var(--soft);font-weight:700}
h1{font-size:1.5em;line-height:1.3;margin:.15em 0 .3em;font-weight:900;letter-spacing:-.02em}
h2{font-size:1.1em;margin:0 0 .4em;font-weight:900}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;padding:16px 18px;margin:10px 0;box-shadow:0 8px 24px rgba(90,60,30,.06)}
.card.gold{background:#FFF6DF;border-color:#F0D58E}
.card.mint{background:#F1F8F3;border-color:#C5E0D0}
.big-btn{display:block;width:100%;border:none;border-radius:22px;padding:.85em .6em;font-size:1.22em;font-weight:900;color:#fff;background:var(--green);box-shadow:0 6px 0 var(--green-d);margin:14px 0 10px}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--green-d)}
.big-btn:disabled{background:#B8C9BF;box-shadow:0 6px 0 #9DB0A5}
.big-btn.gold{background:#D9962A;box-shadow:0 6px 0 #A86E12}
.row{display:flex;gap:12px;margin-top:6px}
.sub-btn{flex:1;border:3px solid var(--line);background:#fff;border-radius:18px;padding:.65em .4em;font-size:1em;font-weight:800;box-shadow:0 4px 0 var(--line);width:100%}
.sub-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.hint{text-align:center;color:var(--soft);font-weight:700;font-size:.88em;margin:0}
.note{font-size:.68em;color:var(--soft);margin-top:auto;padding-top:22px;text-align:center}
.small{font-size:.85em;color:var(--soft);font-weight:700;margin:.3em 0 0}

.today-line{display:flex;align-items:center;justify-content:space-between;font-weight:800}
.pips{display:flex;gap:8px}
.pip{width:26px;height:26px;border-radius:50%;background:#EFE3D3;display:flex;align-items:center;justify-content:center;font-size:.8em}
.pip.on{background:var(--green);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--cream);border-radius:999px;padding:.2em .75em;font-size:.8em;font-weight:800}
.chip.rec{background:var(--gold-l)}
.week{display:flex;gap:6px;margin-top:6px}
.day{flex:1;text-align:center;font-weight:700;color:var(--soft);font-size:.78em}
.day .dot{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1;border-radius:50%;background:#F3E8DA;font-size:1.35em;margin-bottom:3px}
.day.today .dot{box-shadow:0 0 0 3px var(--green) inset}
.tool-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:3px solid var(--line);border-radius:20px;padding:14px 16px;box-shadow:0 4px 0 var(--line);margin:10px 0;font-size:1em}
.tool-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tool-btn .ti{font-size:2em;line-height:1}
.tool-btn b{display:block;font-size:1.05em}
.tool-btn span.s{display:block;font-size:.8em;color:var(--soft);font-weight:700}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.stop{border:none;background:#EFE3D3;font-size:.82em;font-weight:800;padding:.45em .85em;border-radius:14px;white-space:nowrap}
.step{font-weight:800;color:var(--soft);font-size:.85em;text-align:right}
.prompt{font-size:1.12em;font-weight:900;text-align:center;margin:8px 0 12px;min-height:2.7em;display:flex;align-items:center;justify-content:center;line-height:1.35}
.prompt.ok{color:var(--green)} .prompt.no{color:var(--coral)}

.arena{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;background:#fff;border:3px solid var(--line);border-radius:24px;padding:10px;aspect-ratio:1;width:100%;max-width:400px;margin:0 auto}
.cell{min-width:0;min-height:0;overflow:hidden;border-radius:16px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:2.3em;border:none;padding:0;line-height:1}
.cell.center{background:#fff;border:3px dashed #D8C6AF;font-size:3em}
.cell.mask{background:repeating-linear-gradient(45deg,#8a7a6a 0 7px,#cbbba8 7px 14px);border:none}
.cell.hl{background:var(--gold-l);box-shadow:0 0 0 4px var(--gold) inset}
.cell.pbtn{background:#EAF3EE;box-shadow:0 4px 0 #BFD9CB}
.cell.pbtn:active{transform:translateY(3px);box-shadow:none}
.plus{color:#B9A58C;font-weight:900}
.qm{color:#B9A58C;font-weight:900;font-size:.8em}

.choices{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:12px;margin:6px auto 0;max-width:440px;width:100%}
.choice{background:#fff;border:3px solid var(--line);border-radius:20px;padding:14px 6px 10px;font-size:1em;font-weight:800;box-shadow:0 5px 0 var(--line)}
.choice:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.choice .em{display:block;font-size:2.4em;line-height:1.15;margin-bottom:4px}
.choice.txt{font-size:1.12em;padding:16px 8px}
.choice.sel{border-color:var(--green);background:var(--mint);box-shadow:0 5px 0 #9ACBB0}
.choice.right{border-color:var(--green);background:var(--mint)}
.choice.wrong{border-color:#E9B3A0;background:#FBE9E2}
.choice.miss{border-style:dashed;border-color:var(--green)}

.cards{display:grid;gap:10px;grid-template-columns:repeat(var(--c),1fr);max-width:440px;width:100%;margin:0 auto}
.mcard{aspect-ratio:3/4;border-radius:18px;border:3px solid var(--green2);font-size:2.3em;background:var(--green2);color:#fff;box-shadow:0 5px 0 #23573F;padding:0;line-height:1}
.mcard .q{font-size:.6em;font-weight:900;opacity:.75;color:#fff}
.mcard.up{background:#fff;border-color:var(--line);box-shadow:0 5px 0 var(--line)}
.mcard.done{background:var(--mint);border-color:#9ACBB0;box-shadow:none}

.ngrid{display:grid;gap:10px;grid-template-columns:repeat(var(--c),1fr);max-width:420px;width:100%;margin:0 auto}
.num{aspect-ratio:1;border-radius:18px;border:3px solid var(--line);background:#fff;font-size:1.65em;font-weight:900;box-shadow:0 5px 0 var(--line);padding:0}
.num.empty{visibility:hidden}
.num.got{background:var(--green);color:#fff;border-color:var(--green);box-shadow:none;transform:translateY(4px)}
.nx{display:inline-block;min-width:1.6em;padding:0 .3em;margin-left:.3em;background:var(--green);color:#fff;border-radius:12px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

.room{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px;width:100%;margin:0 auto}
.tile{position:relative;aspect-ratio:1;border-radius:18px;background:var(--cream);border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72em;font-weight:800;padding:4px;text-align:center;line-height:1.2}
.tile .pe{font-size:2.3em;line-height:1.15;margin-bottom:2px}
.tile .obj{position:absolute;top:-6px;right:-6px;font-size:2.2em;background:#fff;border-radius:50%;width:1.45em;height:1.45em;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.18)}
button.tile{box-shadow:0 4px 0 var(--line)}
button.tile:active{transform:translateY(3px);box-shadow:none}
.tile.hl{border-color:var(--gold);background:var(--gold-l)}
.tile.ok{border-color:var(--green);background:var(--mint)}
.tile.bad{border-color:#E9B3A0;background:#FBE9E2}

.apples{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:2.4em;margin:6px 0 14px}
.story{font-size:1.15em;font-weight:700;line-height:1.8}
.listen{border:none;background:none;color:var(--green);font-weight:800;font-size:.9em;padding:.4em;margin:0 auto;display:block}
.shoplist{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.shoplist div{background:var(--cream);border-radius:16px;padding:8px 12px;font-weight:900;text-align:center;min-width:5.2em}
.shoplist div span{display:block;font-size:2em;line-height:1.2}
.money{font-size:1.1em;font-weight:800;line-height:1.7;text-align:center}
.clock{width:62%;max-width:240px;display:block;margin:0 auto 10px}
.digit{font-size:4.2em;font-weight:900;text-align:center;height:1.5em;line-height:1.5em;color:var(--green)}
.entered{font-size:1.8em;font-weight:900;text-align:center;letter-spacing:.25em;min-height:1.5em;color:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:6px auto 0;width:100%}
.key{aspect-ratio:1.4;border-radius:16px;border:3px solid var(--line);background:#fff;font-size:1.6em;font-weight:900;box-shadow:0 4px 0 var(--line)}
.key:active{transform:translateY(3px);box-shadow:none}

.center-col{text-align:center;display:flex;flex-direction:column;align-items:stretch}
.icon-big{font-size:4em;line-height:1.1;margin:16px 0 4px;text-align:center}
.desc{font-size:1.05em;font-weight:700;line-height:1.6}
.badge{display:inline-block;background:var(--gold-l);border-radius:999px;padding:.15em .8em;font-size:.8em;font-weight:900;margin:0 auto}
.stat{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:2px dashed var(--line);font-weight:700}
.stat:last-child{border-bottom:none}
.stat b{font-size:1em;text-align:right}
.stars{color:var(--gold);letter-spacing:1px;white-space:nowrap}
.copybox{white-space:pre-wrap;background:var(--cream);border-radius:14px;padding:12px 14px;font-size:.78em;-webkit-user-select:text;user-select:text;margin-top:10px}
label.lbl{display:block;font-weight:800;margin:4px 0 8px}
input.name{font:inherit;font-size:1.05em;padding:.4em .6em;border:3px solid var(--line);border-radius:14px;width:100%;background:#fff;color:var(--ink)}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:3px solid var(--line);background:#fff;border-radius:14px;padding:.5em .2em;font-weight:800;font-size:.9em}
.seg button.on{background:var(--green);color:#fff;border-color:var(--green)}
.danger{border:3px solid #E9C3B3;background:#fff;color:var(--coral);border-radius:14px;padding:.55em;width:100%;font-weight:800;font-size:.9em}
.thing{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:0 4px 0 var(--line);margin:10px 0;font-size:1em}
.thing:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.thing .te{font-size:2.3em;line-height:1}
.thing .tx{flex:1}
.thing .tx b{display:block;font-size:1.05em}
.thing .tx span{display:block;font-size:.85em;font-weight:700;color:var(--green)}
.thing .tx span.none{color:var(--soft)}
.thing img{width:58px;height:58px;object-fit:cover;border-radius:12px}
.photo{width:100%;border-radius:18px;margin-top:10px;display:block}
.placegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.placegrid button{border:3px solid var(--line);background:#fff;border-radius:16px;padding:.7em .3em;font-weight:800;font-size:.95em;box-shadow:0 4px 0 var(--line)}
.filebtn{display:block;text-align:center;border:3px dashed #C9B49A;border-radius:16px;padding:.7em;font-weight:800;color:var(--soft);cursor:pointer}
.filebtn input{display:none}
.why{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;text-align:left;font-size:.85em;font-weight:700;margin:6px 0}
.why summary{cursor:pointer;color:var(--green);font-weight:900}
.why p{margin:.5em 0 0;line-height:1.6;color:var(--soft)}
.ref{font-size:.72em;color:var(--soft);font-weight:700;margin:.5em 0 0;line-height:1.5}
.ref a{color:var(--green)}
.linkbtn{border:none;background:none;color:var(--green);font-weight:800;font-size:.9em;padding:.6em;margin:6px auto 0;display:block}
.code{font-size:2em;font-weight:900;letter-spacing:.12em;text-align:center;background:var(--cream);border-radius:16px;padding:.3em 0;color:var(--green)}
input.codein{font:inherit;font-size:1.6em;font-weight:900;letter-spacing:.12em;text-align:center;text-transform:uppercase;padding:.4em;border:3px solid var(--line);border-radius:16px;width:100%;background:#fff;color:var(--ink)}
.role{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;border:3px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 5px 0 var(--line);margin:12px 0;font-size:1.05em}
.role .ti{font-size:2.6em;line-height:1}
.role b{display:block;font-size:1.1em}
.role span.s{display:block;font-size:.8em;color:var(--soft);font-weight:700}
.fhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.refresh{border:none;background:#EFE3D3;border-radius:14px;padding:.45em .7em;font-weight:800;font-size:.8em;white-space:nowrap}
.alert{background:#FFF1E8;border-color:#F2C2A6}
.game{padding:10px 0;border-bottom:2px dashed var(--line)}
.game:last-child{border-bottom:none}
.game .gt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:800}
.game .gt span{font-size:.78em;color:var(--soft)}
.spark{display:flex;align-items:flex-end;gap:2px;height:52px;margin-top:8px;border-bottom:1px solid #D9C9B3}
.spark button{flex:0 0 calc((100% - 22px) / 12);height:100%;display:flex;align-items:flex-end;border:none;background:none;padding:0}
.spark button i{display:block;width:100%;background:var(--green2);border-radius:4px 4px 0 0;min-height:3px}
.spark button.on i{background:var(--green-d)}
.cap{font-size:.75em;color:var(--soft);font-weight:700;min-height:1.4em;margin-top:4px}
.tbl{width:100%;border-collapse:collapse;font-size:.75em;margin-top:6px}
.tbl td{padding:3px 4px;border-bottom:1px solid var(--line);color:var(--ink)}
.tbl td:last-child{color:var(--soft)}
.big-btn.auto{position:relative;overflow:hidden}
.big-btn.auto::after{content:'';position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.28);animation:fillbar var(--t) linear forwards}
@keyframes fillbar{to{width:100%}}
.autohint{text-align:center;color:var(--soft);font-weight:700;font-size:.78em;margin:-4px 0 0}
.choice,.tile,.role,.tool-btn,.thing{overflow-wrap:anywhere;min-width:0}
.arena,.room{max-width:min(420px,54vh)}
.cards,.ngrid{max-width:min(440px,56vh)}
@media (max-height:760px){
  body{font-size:calc(19px * var(--fs))}
  #app{padding-top:12px}
  .icon-big{font-size:3.2em;margin:8px 0 0}
  .prompt{min-height:2.3em;margin:4px 0 8px}
  .big-btn{padding:.7em .6em;margin:10px 0 8px}
  .choice{padding:10px 6px 8px}
  .choice .em{font-size:2.1em}
  .card{padding:12px 14px;margin:8px 0}
}
.mic{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px auto 6px;font-weight:900;color:var(--green)}
.mic .dotm{width:22px;height:22px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 0 rgba(200,85,47,.5);animation:pulse 1.2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 14px rgba(200,85,47,0)}100%{box-shadow:0 0 0 0 rgba(200,85,47,0)}}
.mic.off .dotm{background:#C9B49A;animation:none}
.heard{text-align:center;font-size:.85em;color:var(--soft);font-weight:700;min-height:1.4em}
.bigpic{font-size:6em;text-align:center;line-height:1.2;margin:6px 0}
.readtxt{font-size:1.45em;font-weight:900;line-height:1.6;text-align:center;word-break:keep-all}
.timebar{height:12px;border-radius:999px;background:#EFE3D3;overflow:hidden;margin:6px 0 10px}
.timebar i{display:block;height:100%;width:100%;background:var(--green2);transform-origin:left;animation:shrink var(--t) linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
.chips.big .chip{font-size:1em;background:var(--mint)}
.steps{margin:.3em 0 0;padding-left:1.2em;font-weight:700;line-height:1.7}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

/* =========================================================
   데이터
   ========================================================= */
const ITEMS=[
  {e:'🍎',n:'사과'},{e:'🍌',n:'바나나'},{e:'🐶',n:'강아지'},{e:'🐱',n:'고양이'},
  {e:'🌸',n:'꽃'},{e:'🏠',n:'집'},{e:'☀️',n:'해'},{e:'🐟',n:'물고기'},
  {e:'🍉',n:'수박'},{e:'🐔',n:'닭'},{e:'☂️',n:'우산'},{e:'🥕',n:'당근'},
  {e:'🍇',n:'포도'},{e:'🌙',n:'달'},{e:'🐻',n:'곰'},{e:'🔔',n:'종'}
];
const CAR='🚗';
const PLACES=[{e:'🛋️',n:'소파'},{e:'🛏️',n:'침대'},{e:'📺',n:'텔레비전 옆'},{e:'🍽️',n:'식탁'},{e:'🚪',n:'현관'},{e:'🗄️',n:'서랍장'},{e:'🪴',n:'화분 옆'},{e:'🧺',n:'바구니'},{e:'🧥',n:'옷걸이'}];
const OBJS=[{e:'👛',n:'지갑'},{e:'🔑',n:'열쇠'},{e:'👓',n:'안경'},{e:'💊',n:'약봉지'},{e:'☂️',n:'우산'},{e:'🧤',n:'장갑'},{e:'📕',n:'수첩'},{e:'📱',n:'휴대폰'}];
const GOODS=[{e:'🥚',n:'달걀'},{e:'🥛',n:'우유'},{e:'🍞',n:'빵'},{e:'🧅',n:'양파'},{e:'🥕',n:'당근'},{e:'🐟',n:'생선'},{e:'🍎',n:'사과'},{e:'🍌',n:'바나나'},{e:'🧄',n:'마늘'},{e:'🥬',n:'배추'},{e:'🍚',n:'쌀'},{e:'🥔',n:'감자'},{e:'🍄',n:'버섯'},{e:'🍗',n:'닭고기'},{e:'🍊',n:'귤'},{e:'🧈',n:'두부'}];
const STORIES=[
 {t:'딸 영희가 전화했어요. 이번 주 토요일 점심때 집에 온대요. 올 때 귤 한 상자를 사 온대요.',
  q:[{q:'누가 온대요?',a:'딸 영희',o:['아들 철수','손녀 지수','동생 순자']},
     {q:'언제 온대요?',a:'토요일 점심',o:['일요일 저녁','금요일 아침','월요일 점심']},
     {q:'무엇을 사 온대요?',a:'귤',o:['사과','떡','고기']}]},
 {t:'병원에서 문자가 왔어요. 다음 주 화요일 오전 10시에 진료 예약이 있대요. 올 때 신분증을 꼭 가져오래요.',
  q:[{q:'어디서 연락이 왔나요?',a:'병원',o:['은행','우체국','시장']},

function lcsRatio(a,b){
  a=cleanK(a);b=cleanK(b);if(!a.length)return 0;
  const dp=Array(b.length+1).fill(0);
  for(let i=1;i<=a.length;i++){let prev=0;for(let j=1;j<=b.length;j++){const t=dp[j];dp[j]=a[i-1]===b[j-1]?prev+1:Math.max(dp[j],dp[j-1]);prev=t}}
  return dp[b.length]/a.length;
}

    for(const w of lex){if(JOSA.some(j=>tok===w+j)){out.add(w);break}}

}

let AC=null;
function tone(freqs,dur=.16,type='sine',vol=.16){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime;
    freqs.forEach((f,i)=>{
      const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
      const s=t+i*dur;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol,s+.02);
      g.gain.exponentialRampToValueAtTime(.001,s+dur*1.8);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+dur*2);
    });
  }catch(e){}
}

function choose(head,prompt,body,opts,cb,cols){

function countBreak(head,cb){

   ========================================================= */
async function setupAlarms(ask){
  const LN=PL.LocalNotifications;
  if(!NATIVE||!LN)return false;
  try{
    let p=await LN.checkPermissions();
    if(p.display!=='granted'){
      if(!ask)return false;
      p=await LN.requestPermissions();
      if(p.display!=='granted')return false;
    }
    try{await LN.createChannel({id:'walk',name:'두뇌 산책 알림',description:'매일 두뇌 산책과 두뇌 체크 알림',importance:4,vibration:true,visibility:1})}catch(e){}
    const pend=await LN.getPending();
    if(pend&&pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    const list=[];
    if(S.alarm.on){
      list.push({id:1,channelId:'walk',title:'🌸 두뇌 산책 할 시간이에요',body:`${S.name}, 오늘의 두뇌 산책 5분 함께해요!`,schedule:{on:{hour:+S.alarm.am,minute:0},allowWhileIdle:true}});
      list.push({id:2,channelId:'walk',title:'🌻 저녁 두뇌 산책',body:`${S.name}, 하루 마무리로 한 번 더 해 볼까요?`,schedule:{on:{hour:+S.alarm.pm,minute:0},allowWhileIdle:true}});
      const du=daysUntilCheck();
      if(du){
        let at=new Date(du.due);at.setHours(+S.alarm.am,30,0,0);
        if(at<=new Date()){at=new Date();at.setDate(at.getDate()+1);at.setHours(+S.alarm.am,30,0,0)}
        list.push({id:3,channelId:'walk',title:'🧭 두뇌 체크 하는 날이에요',body:'4주 만에 두뇌 체크를 해 볼까요? 10분이면 돼요.',schedule:{at,allowWhileIdle:true}});
      }
    }
    if(list.length)await LN.schedule({notifications:list});
    return true;
  }catch(e){return false}
}
async function turnOnAlarms(){
  const ok=await setupAlarms(true);
  S.alarm.asked=true;if(ok)S.alarm.on=true;save();
  home();
  if(ok){good();speak(`알림을 켰어요. 매일 오전 ${S.alarm.am}시와 저녁 ${S.alarm.pm-12}시에 알려 드릴게요.`)}
}

async function api(method,payload){
  const url=syncUrl();if(!url)throw new Error('no_url');
  let res;
  if(method==='GET'){res=await fetch(url+(url.includes('?')?'&':'?')+new URLSearchParams(payload).toString())}
  else{res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})}
  if(!res.ok)throw new Error('http_'+res.status);
  return res.json();
}
function snapshot(){
  const days={},keys=Object.keys(S.days).sort().slice(-180);
  keys.forEach(k=>days[k]=S.days[k]);
  const things={};for(const k in S.things){const t=S.things[k];things[k]={place:t.place,t:t.t}}
  return {v:3,name:S.name,lastOpen:S.lastOpen,lastSession:S.lastSession||0,days,hist:S.hist.slice(-300),
    checks:S.checks,lv:S.lv,first:S.first,things,alarm:{on:S.alarm.on,am:S.alarm.am,pm:S.alarm.pm,asked:S.alarm.asked}};
}
let syncing=false;
async function trySync(){
  if(syncing||!S.link.on||!S.link.token||!syncUrl())return false;
  syncing=true;
  try{
    const r=await api('POST',{action:'sync',code:S.link.code,token:S.link.token,snapshot:snapshot()});
    if(r&&r.ok){S.link.pending=false;S.link.lastSync=Date.now();save();return true}
    return false;
  }catch(e){return false}
  finally{syncing=false}
}

}

function daysUntilCheck(){

  const t=fromKey(keyOf(new Date()));
  return {left:Math.round((due-t)/86400000),due};
}
function weakDomains(c){return Object.keys(DOMAINS).filter(x=>x!=='speed').sort((a,z)=>c.scores[a]-c.scores[z]).slice(0,2)}
function lineup(d){

  const l=lastCheck();

  const recs=[...new Set(weakDomains(l).flatMap(w=>DOMAIN_GAMES[w]))].filter(x=>x!==b&&x!=='speed'&&(x!=='speak'||canSpeakGame()));
  const di=Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000);
  return [{k:'speed'},{k:b},recs.length?{k:recs[di%recs.length],rec:true}:{k:c}];
}

/* 1. 빨리 보기 (처리속도) */
function speedGame(done){
  const L=S.lv.speed;
  if(!S.first)S.first={dur:L.dur,periph:L.periph,date:keyOf(new Date())};
  const N=10,OUT=[0,1,2,3,5,6,7,8];
  let t=0,correct=0,streak=0,up=false;
  const blank=()=>Array.from({length:9},()=>({}));
  const arena=cells=>`<div class="arena">${cells.map((c,i)=>`<div class="cell${i===4?' center':''}${c.cls?' '+c.cls:''}">${c.t||''}</div>`).join('')}</div>`;
  const head=()=>top('빨리 보기',t+' / '+N);
  const frame=(p,body,cls)=>view(`${head()}<div class="prompt${cls?' '+cls:''}">${p}</div>${body}`);
  function next(){
    if(t>=N){
      if(up){L.periph=true;L.dur=1800}
      save();return done({k:'speed',line:`${N}번 중 <b>${correct}번</b> 맞히셨어요`,up,score:Math.round(correct/N*100),lvl:`${L.periph?2:1}단계 ${(L.dur/1000).toFixed(1)}초`});
    }
    t++;
    const pool=shuffle(ITEMS.slice()),target=pool[0];
    const nc=(!L.periph&&L.dur>1100)?2:3;
    const choices=shuffle(pool.slice(0,nc));
    const pos=L.periph?OUT[rand(8)]:-1;
    const c=blank();c[4].t='<span class="plus">＋</span>';
    frame('가운데를 봐 주세요',arena(c));
    later(()=>{
      const c=blank();c[4].t=target.e;if(pos>=0)c[pos].t=CAR;
      frame('&nbsp;',arena(c));
      later(()=>{
        frame('&nbsp;',arena(blank().map(()=>({cls:'mask'}))));
        later(()=>{
          choose(head(),'가운데에 무엇이 있었나요?','',choices.map(x=>({e:x.e,t:x.n,x})),o=>{
            const ok1=o.x===target;
            if(pos>=0)askPos(target,pos,ok1);else finish(ok1,target,pos,ok1);
          },choices.length);
        },300);
      },L.dur);
    },900);
  }
  function askPos(target,pos,ok1){
    tick();
    const cells=Array.from({length:9},(_,i)=>i===4?`<div class="cell center"><span class="qm">?</span></div>`:`<button class="cell pbtn" data-i="${i}"></button>`).join('');
    frame(`자동차 ${CAR}는 어디에 있었나요?`,`<div class="arena">${cells}</div>`);
    $$('.pbtn').forEach(b=>b.onclick=()=>finish(ok1&&+b.dataset.i===pos,target,pos,ok1));
  }
  function finish(ok,target,pos,ok1){
    if(ok){correct++;streak++;good();if(streak>=2){L.dur=Math.max(250,Math.round(L.dur*.85));streak=0}}
    else{streak=0;soft();L.dur=Math.min(3000,Math.round(L.dur*1.2))}
    if(!L.periph&&L.dur<=600)up=true;
    const c=blank();c[4].t=target.e;if(pos>=0){c[pos].t=CAR;c[pos].cls='hl'}
    let msg;
    if(ok)msg=pick(['맞았어요! 👍','정확해요! 👏','아주 좋아요! 😊','눈이 정말 빠르세요!']);
    else if(pos>=0&&ok1)msg='그림은 맞았어요! 자동차는 여기 있었어요';
    else msg=`괜찮아요, 정답은 ${target.e} ${target.n}${batchim(target.n)?'이었어요':'였어요'}`;
    frame(msg,arena(c),ok?'ok':'no');
    later(next,ok?1100:2100);
  }
  next();
}

/* 2. 짝 맞추기 (위치 기억) */
function cardsGame(done){
  const P=S.lv.cards.pairs;
  const its=shuffle(ITEMS.slice()).slice(0,P);
  const deck=shuffle([...its,...its]).map(x=>({e:x.e,up:true,done:false}));
  const cols=P<=3?3:4;
  let open=[],matched=0,moves=0,lock=true;
  view(`${top('짝 맞추기','카드 '+P+'쌍')}<div class="prompt" id="pr">그림 자리를 잘 기억해 두세요</div>
    <div class="cards" style="--c:${cols}">${deck.map((c,i)=>`<button class="mcard" data-i="${i}"></button>`).join('')}</div>`);
  const btns=$$('.mcard'),pr=$('#pr');
  const paint=i=>{const c=deck[i],b=btns[i];b.className='mcard'+(c.done?' done':c.up?' up':'');b.innerHTML=(c.up||c.done)?c.e:'<span class="q">?</span>'};
  deck.forEach((_,i)=>paint(i));
  later(()=>{deck.forEach((c,i)=>{c.up=false;paint(i)});lock=false;pr.textContent='같은 그림 두 장을 찾아 주세요'},2000+P*800);
  btns.forEach((b,i)=>b.onclick=()=>{
    const c=deck[i];
    if(lock||c.up||c.done)return;
    c.up=true;paint(i);tick();open.push(i);
    if(open.length<2)return;
    moves++;const [a,z]=open;open=[];
    if(deck[a].e===deck[z].e){
      deck[a].done=deck[z].done=true;paint(a);paint(z);good();matched++;
      pr.textContent=pick(['찾았어요! 👏','맞아요, 같은 그림이에요!','기억력이 참 좋으세요!']);
      if(matched===P){
        lock=true;let up=false;
        if(moves<=P+2&&P<6){S.lv.cards.pairs=P+1;up=true}
        else if(moves>P*3&&P>2)S.lv.cards.pairs=P-1;
        save();
        later(()=>done({k:'cards',line:`<b>${moves}번</b> 만에 짝을 다 찾으셨어요`,up,score:Math.min(100,Math.round(P/moves*100)),lvl:`카드 ${P}쌍`}),900);
      }
    }else{
      lock=true;
      later(()=>{deck[a].up=deck[z].up=false;paint(a);paint(z);lock=false;pr.textContent='아쉬워요, 다시 찾아볼까요?'},1200);
    }
  });
}

/* 4. 물건 자리 기억 */
function roomHTML(o){
  o=o||{};
  return `<div class="room">${PLACES.map((p,i)=>{
    const cls=o.cls&&o.cls[i]?' '+o.cls[i]:'';

  }).join('')}</div>`;
}
function placeGame(done){
  const ROUNDS=2,k0=S.lv.place.k;let round=0,tot=0,cor=0,up=false;
  const head=()=>top('물건 자리 기억',(round)+' / '+ROUNDS);
  function startRound(){
    if(round>=ROUNDS){save();return done({k:'place',line:`${tot}개 중 <b>${cor}개</b> 자리를 기억하셨어요`,up,score:Math.round(cor/tot*100),lvl:`물건 ${k0}개`})}
    round++;
    const k=S.lv.place.k;
    const objs=shuffle(OBJS.slice()).slice(0,k);
    const spots=shuffle([...Array(9).keys()]).slice(0,k);
    let i=0;
    view(`${head()}<div class="prompt">물건을 어디에 두는지 잘 보세요</div>${roomHTML()}`);
    speak('물건을 어디에 두는지 잘 보세요');
    later(showOne,1600);
    function showOne(){
      if(i>=k){later(()=>countBreak(head(),askAll),400);return}
      const o=objs[i],p=PLACES[spots[i]],items={},cls={};
      items[spots[i]]=o.e;cls[spots[i]]='hl';
      const txt=`${o.e} ${eul(o.n)} <b>${p.n}</b>에 뒀어요`;
      view(`${head()}<div class="prompt">${txt}</div>${roomHTML({items,cls})}`);
      speak(`${eul(o.n)} ${p.n}에 뒀어요`);
      i++;later(showOne,2800);
    }
    function askAll(){
      const order=shuffle([...Array(k).keys()]);let j=0,rc=0;
      ask();
      function ask(){
        if(j>=k){
          tot+=k;cor+=rc;
          if(rc===k&&k<5){S.lv.place.k=k+1;up=true}
          else if(rc<=k/2&&k>2)S.lv.place.k=k-1;
          save();return startRound();
        }
        const idx=order[j],o=objs[idx];
        view(`${head()}<div class="prompt">${o.e} ${eun(o.n)} 어디에 뒀나요?</div>${roomHTML({click:true})}`);
        speak(`${eun(o.n)} 어디에 뒀나요?`);
        let answered=false;
        $$('.tile').forEach(b=>b.onclick=()=>{
          if(answered)return;answered=true;
          const sel=+b.dataset.i,ok=sel===spots[idx],cls={},items={};
          items[spots[idx]]=o.e;cls[spots[idx]]='ok';if(!ok)cls[sel]='bad';
          if(ok){rc++;good()}else soft();
          view(`${head()}<div class="prompt ${ok?'ok':'no'}">${ok?pick(['맞았어요! 👍','정확해요! 👏']):`괜찮아요, ${eun(o.n)} ${PLACES[spots[idx]].n}에 있었어요`}</div>${roomHTML({items,cls})}`);
          j++;later(ask,ok?1100:2200);
        });
      }
    }
  }
  startRound();
}

/* 5. 이야기 기억 */
function storyGame(done){
  const ROUNDS=2,qn=S.lv.story.q;let round=0,tot=0,cor=0,up=false;
  const used=shuffle([...Array(STORIES.length).keys()]).slice(0,ROUNDS);
  const head=()=>top('이야기 기억',round+' / '+ROUNDS);
  let reasked=false;
  function startRound(){
    if(round>=ROUNDS&&!reasked){
      reasked=true;
      const st=STORIES[used[0]],q=st.q[0];
      view(`${head()}<div class="prompt">한 번 더! 처음 들은 이야기 기억나세요?</div><div class="icon-big">💭</div>`);
      speak('한 번 더! 처음 들은 이야기 기억나세요?');
      later(()=>{
        speak(q.q);
        choose(head(),'처음 이야기 · '+q.q,'',shuffle([q.a,...q.o]).map(t=>({t})),(o,b)=>{
          tot++;
          if(o.t===q.a){cor++;good();b.classList.add('right')}
          else{soft();b.classList.add('wrong');$$('.choice').forEach(x=>{if(x.textContent===q.a)x.classList.add('right')})}
          later(startRound,o.t===q.a?1000:1900);
        },1);
      },1800);
      return;
    }
    if(round>=ROUNDS){
      if(cor===tot&&qn<3){S.lv.story.q=3;up=true}
      else if(cor<=tot/2&&qn>2)S.lv.story.q=2;
      save();return done({k:'story',line:`${tot}문제 중 <b>${cor}문제</b> 기억하셨어요`,up,score:Math.round(cor/tot*100),lvl:`질문 ${qn}개`});
    }
    const st=STORIES[used[round]];round++;
    view(`${head()}<div class="prompt">잘 듣고 기억해 주세요</div>
      <div class="card story">${st.t}</div>
      <button class="listen" id="ag">🔊 다시 듣기</button>
      <button class="big-btn" id="ok">다 들었어요 ▶</button>${autoHint()}`);
    speak(st.t);
    const go=()=>{hush();countBreak(head(),()=>ask(st,0))};
    const arm=()=>autoGo($('#ok'),Math.max(9000,st.t.length*200+3500),go);
    $('#ag').onclick=()=>{RUN++;speak(st.t);arm()};
    arm();
  }
  function ask(st,j){
    const qs=st.q.slice(0,qn);
    if(j>=qs.length)return startRound();
    const q=qs[j];
    const opts=shuffle([q.a,...q.o]).map(t=>({t}));
    speak(q.q);
    choose(head(),q.q,'',opts,(o,b)=>{
      tot++;
      if(o.t===q.a){cor++;good();b.classList.add('right')}
      else{soft();b.classList.add('wrong');$$('.choice').forEach(x=>{if(x.textContent===q.a)x.classList.add('right')})}
      later(()=>ask(st,j+1),o.t===q.a?1000:1900);
    },1);
  }
  startRound();
}

/* 6. 장보기 기억 */
function shopGame(done){
  const ROUNDS=2,k0=S.lv.shop.k;let round=0,tot=0,hitsAll=0,up=false;
  const head=()=>top('장보기 기억',round+' / '+ROUNDS);
  function startRound(){
    if(round>=ROUNDS){save();return done({k:'shop',line:`살 것 ${tot}개 중 <b>${hitsAll}개</b>를 기억하셨어요`,up,score:Math.round(hitsAll/tot*100),lvl:`${k0}개`})}
    round++;
    const k=S.lv.shop.k;
    const pool=shuffle(GOODS.slice()),list=pool.slice(0,k);
    const size=k>=5?12:9;
    const board=shuffle(pool.slice(0,size));
    view(`${head()}<div class="prompt">🛒 오늘 시장에서 살 것이에요</div>
      <div class="card"><div class="shoplist">${list.map(g=>`<div><span>${g.e}</span>${g.n}</div>`).join('')}</div></div>`);
    speak('오늘 살 것은 '+list.map(g=>g.n).join(', ')+'이에요');
    later(()=>{
      view(`${head()}<div class="prompt">🚶 시장까지 걸어가는 중이에요…</div><div class="icon-big">🏪</div>`);
      later(choosePhase,2600);
    },2600+k*1500);
    function choosePhase(){
      const sel=new Set();
      view(`${head()}<div class="prompt">살 것을 모두 골라 주세요 (${k}개)</div>
        <div class="choices" style="--c:${size===12?4:3}">${board.map((g,i)=>`<button class="choice" data-i="${i}"><span class="em">${g.e}</span>${g.n}</button>`).join('')}</div>
        <button class="big-btn" id="fin" disabled>다 골랐어요</button>`);
      speak('살 것을 모두 골라 주세요');
      const fin=$('#fin');let finished=false,pickTok=0;
      $$('.choice').forEach(b=>b.onclick=()=>{
        if(finished)return;
        const i=+b.dataset.i;
        if(sel.has(i))sel.delete(i);else sel.add(i);
        b.classList.toggle('sel');tick();fin.disabled=sel.size===0;
        const tk=++pickTok;if(S.auto.on&&sel.size>=k)later(()=>{if(!finished&&tk===pickTok&&sel.size>=k)fin.onclick()},1500);
      });
      fin.onclick=()=>{
        if(finished)return;finished=true;
        let hits=0,fa=0;
        $$('.choice').forEach(b=>{
          const i=+b.dataset.i,inList=list.includes(board[i]);
          b.classList.remove('sel');b.onclick=null;
          if(sel.has(i)&&inList){hits++;b.classList.add('right')}
          else if(sel.has(i)){fa++;b.classList.add('wrong')}
          else if(inList)b.classList.add('miss');
        });
        tot+=k;hitsAll+=hits;
        if(hits===k&&fa===0&&k<7){S.lv.shop.k=k+1;up=true}
        else if(hits<k-1&&k>3)S.lv.shop.k=k-1;
        save();
        if(hits===k)good();else soft();
        const p=$('.prompt');p.className='prompt '+(hits===k?'ok':'no');
        p.innerHTML=hits===k?'다 맞히셨어요! 👏':`${k}개 중 ${hits}개 맞히셨어요. 점선이 빠진 물건이에요`;
        fin.textContent='다음 ▶';autoGo(fin,3800,startRound);
      };
    }
  }
  startRound();
}

/* 8. 오늘 알기 (날짜·시계) */
function clockSVG(h,m){
  const ha=((h%12)+m/60)*30,ma=m*6;
  let nums='';
  for(let i=1;i<=12;i++){const a=(i*30-90)*Math.PI/180;nums+=`<text x="${100+74*Math.cos(a)}" y="${100+74*Math.sin(a)+8}" text-anchor="middle" font-size="22" font-weight="900" fill="#2A211A" font-family="Noto Sans KR,sans-serif">${i}</text>`}
  return `<svg class="clock" viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" fill="#fff" stroke="#2F6E50" stroke-width="7"/>${nums}
    <line x1="100" y1="100" x2="100" y2="52" stroke="#2A211A" stroke-width="9" stroke-linecap="round" transform="rotate(${ha} 100 100)"/>
    <line x1="100" y1="100" x2="100" y2="30" stroke="#C8552F" stroke-width="5" stroke-linecap="round" transform="rotate(${ma} 100 100)"/>
    <circle cx="100" cy="100" r="7" fill="#2A211A"/></svg>`;
}
const tlabel=(h,m)=>m===0?`${h}시`:`${h}시 ${m}분`;
function todayGame(done){
  const d=new Date(),L=S.lv.today;let t=0,cor=0,clkOk=0;const N=5;
  const head=()=>top('오늘 알기',t+' / '+N);
  const qs=[
    ()=>{const w=d.getDay();return {p:'오늘은 무슨 요일인가요?',a:WD[w]+'요일',o:shuffle([1,2,3,4,5,6]).slice(0,3).map(x=>WD[(w+x)%7]+'요일')}},
    ()=>{const o=[-1,1,7].map(x=>{const y=new Date(d);y.setDate(d.getDate()+x);return md(y)});return {p:'오늘은 몇 월 며칠인가요?',a:md(d),o}},
    ()=>{const s=season(d.getMonth()+1);return {p:'지금은 무슨 계절인가요?',a:s,o:['봄','여름','가을','겨울'].filter(x=>x!==s)}},
    ()=>clockQ(),()=>clockQ()
  ];
  function clockQ(){
    const h=1+rand(12),m=L.clk>=2?pick([0,15,30,45]):pick([0,30]);
    const h2=h%12+1,m2=m===0?30:m===30?0:(m+30)%60;

    return {p:'시계가 몇 시를 가리키나요?',a:tlabel(h,m),o,body:clockSVG(h,m),clk:true};
  }
  function next(){
    if(t>=N){
      let up=false;if(clkOk===2&&L.clk<2){L.clk=2;up=true}
      save();
      const s=`오늘은 ${d.getFullYear()}년 ${md(d)} ${WD[d.getDay()]}요일, ${ieyo(season(d.getMonth()+1))}`;
      view(`${head()}<div class="center-col"><div class="icon-big">📅</div><div class="card desc" style="text-align:center">${s}</div><button class="big-btn" id="nx2">다음 ▶</button>${autoHint()}</div>`);
      speak(s);
      autoGo($('#nx2'),5000,()=>done({k:'today',line:`${N}문제 중 <b>${cor}문제</b> 맞히셨어요`,up,score:Math.round(cor/N*100),lvl:`시계 ${L.clk}단계`}));
      return;
    }
    const q=qs[t]();t++;
    const opts=shuffle([q.a,...q.o]).map(x=>({t:x}));
    speak(q.p);
    choose(head(),q.p,q.body||'',opts,(o,b)=>{
      if(o.t===q.a){cor++;if(q.clk)clkOk++;good();b.classList.add('right')}
      else{soft();b.classList.add('wrong');$$('.choice').forEach(x=>{if(x.textContent===q.a)x.classList.add('right')})}
      later(next,o.t===q.a?1000:2000);
    },opts.length===4?2:1);
  }
  next();
}


/* 9. 말하기 (이름 말하기 · 소리 내어 읽기 · 생각나는 대로 말하기) */
function speakGame(done){
  const my=RUN;
  const alive=()=>my===RUN;
  let step=0;const STEPS=7;
  const head=()=>top('말하기',step+' / '+STEPS);
  const scores={name:[],read:[],flu:null};
  const micHTML=(on,txt)=>`<div class="mic${on?'':' off'}" id="mic"><span class="dotm"></span><span>${txt}</span></div><div class="heard" id="hd"></div>`;
  const setMic=(on,txt)=>{const m=$('#mic');if(m){m.className='mic'+(on?'':' off');m.lastElementChild.textContent=txt}};
  const setHeard=t=>{const h=$('#hd');if(h)h.textContent=t};
  (async()=>{
    const ok=await srReady();if(!alive())return;
    /* 1) 그림 이름 말하기 */
    const pics=shuffle(ITEMS.slice()).slice(0,4);
    for(const it of pics){
      step++;if(!alive())return;
      const names=SAY_NAMES[it.e]||[it.n];
      if(!ok){ // 음성인식이 안 되면 눌러서 대답
        const opts=shuffle([it,...shuffle(ITEMS.filter(x=>x!==it)).slice(0,2)]).map(x=>({t:x.n,x}));
        const r=await new Promise(res=>choose(head(),'이건 무엇일까요?',`<div class="bigpic">${it.e}</div>`,opts,(o,b)=>{const c=o.x===it;b.classList.add(c?'right':'wrong');c?good():soft();later(()=>res(c),1000)},3));
        scores.name.push(r?100:0);continue;
      }
      let got=false;
      for(let tryN=0;tryN<2&&!got;tryN++){
        const q=tryN===0?'이건 무엇일까요? 말해 주세요':`힌트! 첫 글자는 '${it.n[0]}'예요`;
        view(`${head()}<div class="prompt">${q}</div><div class="bigpic">${it.e}</div>${micHTML(false,'잠깐만요…')}`);
        await speakAsync(tryN===0?'이건 무엇일까요?':`힌트! 첫 글자는 ${it.n[0]}예요`);if(!alive())return;
        setMic(true,'듣고 있어요. 말씀해 주세요');
        const m=await listen(7000);if(!alive())return;
        setHeard(m[0]?`"${m[0]}"`:'');
        got=heardAny(m,names);
      }
      scores.name.push(got?100:0);
      if(got){good();setMic(false,'맞아요! 👏');await speakAsync(`맞아요, ${it.n}!`)}
      else{soft();setMic(false,`${ieyo(it.n)}`);await speakAsync(`${ieyo(it.n)}. 괜찮아요.`)}
      if(!alive())return;
    }
    /* 2) 소리 내어 읽기 */
    const reads=shuffle(READS.slice()).slice(0,2);
    for(const s of reads){
      step++;if(!alive())return;
      view(`${head()}<div class="prompt">소리 내어 읽어 주세요</div><div class="card readtxt">${s}</div>${ok?micHTML(false,'잠깐만요…'):'<button class="big-btn" id="rd">다 읽었어요</button>'+autoHint()}`);
      await speakAsync('소리 내어 읽어 주세요');if(!alive())return;
      if(!ok){await new Promise(res=>autoGo($('#rd'),9000,res));continue}
      let best=0;
      for(let tryN=0;tryN<2&&best<.75;tryN++){
        if(tryN===1){setMic(false,'한 번 더 읽어 볼까요?');await speakAsync('좋아요! 한 번 더 읽어 볼까요?');if(!alive())return}
        setMic(true,'듣고 있어요. 읽어 주세요');
        const m=await listen(12000);if(!alive())return;
        const r=Math.max(0,...m.map(x=>lcsRatio(s,x)));
        if(r>best)best=r;
        setHeard(m[0]?`"${m[0]}"`:'');
      }
      scores.read.push(Math.round(best*100));
      if(best>=.75){good();setMic(false,'또박또박 잘 읽으셨어요 👏');await speakAsync('또박또박 잘 읽으셨어요')}
      else{setMic(false,'잘하셨어요!');await speakAsync('잘하셨어요!')}
      if(!alive())return;
    }
    /* 3) 생각나는 대로 말하기 (30초) */
    step++;
    let cat=null,found=new Set();
    if(ok){
      const cats=Object.keys(FLUENCY);cat=cats[Math.floor(Date.now()/86400000)%cats.length];
      const lex=FLUENCY[cat];
      view(`${head()}<div class="prompt">${cat} 이름을 생각나는 대로 많이 말해 주세요</div>
        <div class="timebar"><i id="tbar" style="--t:30000ms;animation-play-state:paused"></i></div>
        ${micHTML(false,'잠깐만요…')}<div class="chips big" id="fw" style="justify-content:center"></div>`);
      await speakAsync(`30초 동안 ${cat} 이름을 생각나는 대로 많이 말해 주세요. 시작!`);if(!alive())return;
      $('#tbar').style.animationPlayState='running';
      setMic(true,'듣고 있어요');
      const end=Date.now()+30000;
      while(Date.now()<end-800&&alive()){
        const m=await listen(Math.min(9000,end-Date.now()));if(!alive())return;
        m.forEach(t=>fluencyHits(t,lex).forEach(w=>{if(!found.has(w)){found.add(w);tick();const fw=$('#fw');if(fw)fw.insertAdjacentHTML('beforeend',`<span class="chip">${w}</span>`)}}));
      }
      stopListen();
      scores.flu=Math.min(100,Math.round(found.size/12*100));
      setMic(false,`${cat} ${found.size}개를 말씀하셨어요!`);good();
      await speakAsync(`${cat} 이름을 ${found.size}개 말씀하셨어요!`);if(!alive())return;
    }
    const parts=[];
    if(scores.name.length)parts.push(scores.name.reduce((a,b)=>a+b,0)/scores.name.length);
    if(scores.read.length)parts.push(scores.read.reduce((a,b)=>a+b,0)/scores.read.length);
    if(scores.flu!=null)parts.push(scores.flu);
    const nameOk=scores.name.filter(x=>x===100).length;
    const line=`그림 ${pics.length}개 중 <b>${nameOk}개</b> 이름을 맞히셨어요`+(cat?`<br>${cat} 이름 <b>${found.size}개</b>를 말씀하셨어요`:'');
    done({k:'speak',line,up:false,score:parts.length?Math.round(parts.reduce((a,b)=>a+b,0)/parts.length):null,lvl:cat?`${cat} ${found.size}개`:'눌러서 대답'});
  })();
}

let SES=null;
function startSession(){RUN++;SES={list:lineup(new Date()),i:0};intro()}
function intro(){
  const it=SES.list[SES.i],g=GAMES[it.k],text=g.say();
  view(`${top('놀이 '+(SES.i+1)+' / '+SES.list.length)}
    <div class="center-col">
      <div class="icon-big">${g.icon}</div>
      <h1 style="text-align:center;margin-bottom:.1em">${g.title}</h1>
      ${it.rec?'<span class="badge">두뇌 체크 맞춤 놀이</span>':''}
      <div class="card desc">${text}</div>
      <button class="listen" id="again">🔊 설명 다시 듣기</button>
      <details class="why"><summary>📖 왜 이 놀이를 하나요?</summary><p>${g.why}</p></details>
      <button class="big-btn" id="go">시작하기</button>${autoHint()}
    </div>`);
  speak(text);
  const start=()=>{hush();g.run(r=>result(r))};
  const arm=()=>autoGo($('#go'),Math.max(6500,text.length*160+2500),start);
  $('#again').onclick=()=>{RUN++;speak(text);arm()};
  arm();
}
function result(r){
  if(typeof r.score==='number'){
    S.hist.push({d:keyOf(new Date()),t:Date.now(),k:r.k,s:r.score,l:r.lvl||''});
    if(S.hist.length>400)S.hist=S.hist.slice(-400);
    save();
  }
  const last=SES.i===SES.list.length-1;
  const praise=pick(['참 잘하셨어요!','훌륭하세요!','멋지세요!','정말 잘하시네요!']);
  view(`<div class="center-col" style="flex:1;justify-content:center">
      <div class="icon-big">⭐</div>
      <h1 style="text-align:center">${praise}</h1>
      <div class="card desc" style="text-align:center">${r.line}</div>
      ${r.up?'<p class="hint">솜씨가 늘어서 다음엔 한 단계 올라가요 ⬆️</p>':''}
      <button class="big-btn" id="nx">${last?'산책 마치기 ▶':'다음 놀이 ▶'}</button>${autoHint()}
    </div>`);
  speak(praise+' '+r.line);
  autoGo($('#nx'),5000,()=>{if(last)finishSession();else{SES.i++;intro()}});
}
function finishSession(){
  const k=keyOf(new Date()),prev=S.days[k]||{};
  S.days[k]={s:(prev.s||0)+1,dur:S.lv.speed.dur,periph:S.lv.speed.periph};
  S.lastSession=Date.now();
  save();queueSync();
  const c=S.days[k].s;
  const sub=c===1?'오늘 한 번 하셨어요. 저녁에 한 번 더 하면 더 좋아요.':c===2?'오늘 두 번 다 하셨어요! 내일은 다른 놀이로 만나요.':`오늘 벌써 ${c}번째예요! 대단하세요.`;
  view(`<div class="center-col" style="flex:1;justify-content:center">
      <div class="icon-big">${c>=2?'🌻':'🌸'}</div>
      <h1 style="text-align:center">오늘의 두뇌 산책 끝!</h1>
      <div class="card desc" style="text-align:center">${esc(S.name)}, 참 잘하셨어요.<br>${sub}</div>
      <button class="big-btn" data-a="home">처음 화면으로</button>
    </div>`);
  speak(`오늘의 두뇌 산책 끝! ${S.name}, 참 잘하셨어요. ${sub}`);
}

/* 2. 날짜 감각 */
function ckOrient(){
  const d=new Date(),s=season(d.getMonth()+1);
  const qs=[
    {p:'오늘은 무슨 요일인가요?',a:WD[d.getDay()]+'요일',o:shuffle([1,2,3,4,5,6]).slice(0,3).map(x=>WD[(d.getDay()+x)%7]+'요일')},
    {p:'지금은 몇 월인가요?',a:(d.getMonth()+1)+'월',o:[2,5,9].map(x=>((d.getMonth()+x)%12+1)+'월')},
    {p:'지금은 무슨 계절인가요?',a:s,o:['봄','여름','가을','겨울'].filter(x=>x!==s)}
  ];
  let j=0,c=0;
  (function ask(){
    if(j>=qs.length){CK.scores.orient=Math.round(c/3*100);return ckSpeed()}
    const q=qs[j++];speak(q.p);
    choose(ckHead(2),q.p,'',shuffle([q.a,...q.o]).map(t=>({t})),o=>{if(o.t===q.a)c++;tick();later(ask,350)},2);
  })();
}
/* 3. 눈의 빠르기: 같은 그림 빨리 찾기 */
function ckSpeed(){
  const N=6;let j=0,okN=0,rts=[];
  view(`${ckHead(3)}<div class="center-col"><div class="icon-big">⚡</div><div class="card desc">위에 나온 그림과 <b>같은 그림</b>을<br>아래에서 빨리 찾아 눌러 주세요.</div><button class="big-btn" id="go">시작하기</button>${autoHint()}</div>`);
  speak('위에 나온 그림과 같은 그림을 아래에서 빨리 찾아 눌러 주세요.');
  autoGo($('#go'),7000,()=>{hush();trial()});
  function trial(){
    if(j>=N){
      const avg=rts.length?rts.reduce((a,b)=>a+b,0)/rts.length:5;
      const base=Math.max(20,Math.min(100,100-(avg-1.3)*32));
      CK.scores.speed=Math.round(base*(okN/N));return ckAttention();
    }
    j++;
    const pool=shuffle(ITEMS.slice()).slice(0,6),target=pick(pool);
    view(`${ckHead(3)}<div class="prompt">이 그림을 찾아 주세요 <span style="font-size:1.8em;margin-left:.3em">${target.e}</span></div>
      <div class="choices" style="--c:3">${pool.map((x,i)=>`<button class="choice" data-i="${i}"><span class="em">${x.e}</span></button>`).join('')}</div>`);
    const t0=performance.now();let done=false;
    $$('.choice').forEach(b=>b.onclick=()=>{
      if(done)return;done=true;
      const ok=pool[+b.dataset.i]===target;
      if(ok){okN++;rts.push((performance.now()-t0)/1000);tick();b.classList.add('right')}else b.classList.add('wrong');
      later(trial,450);
    });
  }
}
/* 4. 집중력: 숫자 따라 누르기 */
function ckAttention(){
  let len=3,tries=0,best=0;
  view(`${ckHead(4)}<div class="center-col"><div class="icon-big">🎯</div><div class="card desc">숫자가 하나씩 나와요.<br>다 나오면 <b>나온 순서대로</b> 눌러 주세요.</div><button class="big-btn" id="go">시작하기</button>${autoHint()}</div>`);
  speak('숫자가 하나씩 나와요. 다 나오면 나온 순서대로 눌러 주세요.');
  autoGo($('#go'),7000,()=>{hush();round()});
  function finish(){CK.scores.attention={0:15,3:40,4:60,5:80,6:100}[best];ckCalc()}
  function round(){
    const seq=[];while(seq.length<len){const v=1+rand(9);if(v!==seq[seq.length-1])seq.push(v)}
    let i=0;
    view(`${ckHead(4)}<div class="prompt">숫자를 잘 보세요 (${len}개)</div><div class="card"><div class="digit" id="dg"></div></div>`);
    const dg=$('#dg');
    (function show(){
      if(i>=seq.length){dg.textContent='';later(input,400);return}
      dg.textContent=seq[i];speak(String(seq[i]));i++;
      later(()=>{dg.textContent='';later(show,250)},900);
    })();
    function input(){
      const got=[];
      view(`${ckHead(4)}<div class="prompt">나온 순서대로 눌러 주세요</div><div class="entered" id="en">&nbsp;</div>
        <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(v=>`<button class="key" data-v="${v}">${v}</button>`).join('')}</div>`);
      speak('나온 순서대로 눌러 주세요');
      const en=$('#en');let fin=false;
      $$('.key').forEach(b=>b.onclick=()=>{
        if(fin)return;tick();got.push(+b.dataset.v);en.textContent=got.join(' ');
        if(got.length<len)return;
        fin=true;
        const ok=got.every((v,k)=>v===seq[k]);
        const p=$('.prompt');p.className='prompt '+(ok?'ok':'no');
        p.textContent=ok?'잘하셨어요!':'괜찮아요';
        if(ok){best=len;tries=0;len++;if(len>6)return later(finish,700);later(round,800)}
        else{tries++;if(tries>=2)return later(finish,700);later(round,800)}
      });
    }
  }
}
/* 5. 계산력 */
function ckCalc(){
  const qs=[moneyQ(1),moneyQ(2),moneyQ(3)];let j=0,c=0;
  (function ask(){
    if(j>=qs.length){CK.scores.calc=Math.round(c/3*100);return ckSpace()}
    const q=qs[j++];
    const ds=shuffle(q.d.slice()).filter(v=>q.a+v>0).slice(0,2);
    choose(ckHead(5),'천천히 계산해 보세요',`<div class="card money">${q.q}</div>`,shuffle([q.a,...ds.map(v=>q.a+v)]).map(v=>({t:won(v),v})),o=>{if(o.v===q.a)c++;tick();later(ask,350)},1);
  })();
}
/* 6. 물건 자리 기억 */
function ckSpace(){
  const objs=shuffle(OBJS.slice()).slice(0,3),spots=shuffle([...Array(9).keys()]).slice(0,3);
  let i=0;
  view(`${ckHead(6)}<div class="prompt">물건을 어디에 두는지 잘 보세요</div>${roomHTML()}`);
  speak('물건을 어디에 두는지 잘 보세요');
  later(show,1600);
  function show(){
    if(i>=3){later(()=>countBreak(ckHead(6),ask),400);return}
    const o=objs[i],items={},cls={};items[spots[i]]=o.e;cls[spots[i]]='hl';
    view(`${ckHead(6)}<div class="prompt">${o.e} ${eul(o.n)} <b>${PLACES[spots[i]].n}</b>에 뒀어요</div>${roomHTML({items,cls})}`);
    speak(`${eul(o.n)} ${PLACES[spots[i]].n}에 뒀어요`);
    i++;later(show,2800);
  }
  let j=0,c=0;const order=shuffle([0,1,2]);
  function ask(){
    if(j>=3){CK.scores.space=Math.round(c/3*100);return ckRecall()}
    const idx=order[j++],o=objs[idx];
    view(`${ckHead(6)}<div class="prompt">${o.e} ${eun(o.n)} 어디에 뒀나요?</div>${roomHTML({click:true})}`);
    speak(`${eun(o.n)} 어디에 뒀나요?`);
    let done=false;
    $$('.tile').forEach(b=>b.onclick=()=>{if(done)return;done=true;if(+b.dataset.i===spots[idx])c++;tick();b.classList.add('hl');later(ask,400)});
  }
}
/* 7. 처음 단어 떠올리기 */
function ckRecall(){
  const w=CK.words,board=shuffle([...w,...shuffle(WORD_FOILS.slice()).slice(0,6)]);
  const sel=new Set();
  view(`${ckHead(7)}<div class="prompt">처음에 기억한 세 가지를 골라 주세요</div>
    <div class="choices" style="--c:3">${board.map((x,i)=>`<button class="choice" data-i="${i}"><span class="em">${x.e}</span>${x.n}</button>`).join('')}</div>
    <button class="big-btn" id="fin" disabled>다 골랐어요</button>
    <button class="listen" id="dk">잘 생각이 안 나요</button>`);
  speak('처음에 기억한 세 가지를 골라 주세요');
  const fin=$('#fin');let ended=false;
  $$('.choice').forEach(b=>b.onclick=()=>{
    if(ended)return;
    const i=+b.dataset.i;
    if(sel.has(i)){sel.delete(i);b.classList.remove('sel')}
    else{if(sel.size>=3)return;sel.add(i);b.classList.add('sel')}
    tick();fin.disabled=sel.size===0;
    if(S.auto.on&&sel.size===3)later(()=>{if(sel.size===3)end()},1200);
  });
  const end=()=>{
    if(ended)return;ended=true;
    let hits=0;sel.forEach(i=>{if(w.includes(board[i]))hits++});
    CK.scores.memory=Math.round(hits/3*100);ckFinish();
  };
  fin.onclick=end;$('#dk').onclick=end;
}
function ckFinish(){
  const sc=CK.scores,keys=Object.keys(DOMAINS);
  const total=Math.round(keys.reduce((a,k)=>a+sc[k],0)/keys.length);
  let best=keys[0];keys.forEach(k=>{if(sc[k]>sc[best])best=k});
  const prev=lastCheck();
  S.checks.push({date:keyOf(new Date()),scores:sc,total,type:best,prevTotal:prev?prev.total:null});
  save();good();
  setupAlarms(false);queueSync();
  checkResult(true);
}
function checkResult(fresh){

function whenTxt(ts){
  const d=new Date(ts),now=new Date();
  const dd=Math.round((fromKey(keyOf(now))-fromKey(keyOf(d)))/86400000);
  const h=d.getHours(),ap=h<12?'오전':'오후',hh=h%12||12,mm=d.getMinutes();
  const t=`${ap} ${hh}시${mm?' '+mm+'분':''}`;
  return dd===0?`오늘 ${t}`:dd===1?`어제 ${t}`:`${md(d)}`;
}

    seg('#pm',()=>S.alarm.pm,v=>{S.alarm.pm=+v;re()});
  }
  paintLink();
  const tf=$('#tofam');let tfArmed=false;
  if(tf)tf.onclick=()=>{if(!tfArmed){tfArmed=true;tf.textContent='정말 바꿀까요? 한 번 더 누르세요';return}S.role='family';save();home()};
  const rs=$('#rs');
  rs.onclick=()=>{
    if(!armed){armed=true;rs.textContent='정말 지울까요? 한 번 더 누르세요';return}
    const keep={name:S.name,fs:S.fs,voice:S.voice,sound:S.sound,alarm:S.alarm,role:S.role,link:S.link,auto:S.auto};
    S=Object.assign(clone(DEF),keep);save();setupAlarms(false);queueSync();
    rs.textContent='기록을 모두 지웠어요 (놀이·두뇌 체크·물건 자리)';rs.disabled=true;

}

    if(S.fam.remind){
      const nm=((S.fam.data||{}).snapshot||{}).name||'어르신';
      await LN.schedule({notifications:[{id:11,channelId:'fam',title:`👵 오늘 ${nm} 두뇌 산책 기록`,body:'오늘 기록을 확인하고 안부를 전해 보세요.',schedule:{on:{hour:+S.fam.hour,minute:0},allowWhileIdle:true}}]});
    }
    return true;
  }catch(e){return false}
}
function famSettings(){
  RUN++;hush();
  view(`${top('설정','',true)}
    <h1>가족용 설정 ⚙️</h1>
    <div class="card">
      <label class="lbl">연결된 가족 코드</label>
      <div class="code">${esc(S.fam.code||'-')}</div>
      <button class="sub-btn" id="chg" style="margin-top:12px">다른 코드 넣기</button>
    </div>
    ${NATIVE?`<div class="card mint">
      <h2>🔔 매일 저녁 확인 알림</h2>
      <div class="seg" id="fr"><button data-v="1">켜기</button><button data-v="0">끄기</button></div>
      <label class="lbl" style="margin-top:14px">알림 시간</label>
      <div class="seg" id="fh"><button data-v="19">저녁 7시</button><button data-v="20">8시</button><button data-v="21">9시</button></div>
      <p class="small" id="fmsg"></p>
    </div>`:''}
    <div class="card">
      <label class="lbl">글씨 크기</label>
      <div class="seg" id="fs"><button data-v="1">보통</button><button data-v="1.15">크게</button><button data-v="1.3">아주 크게</button></div>
    </div>
    <button class="linkbtn" id="tog">이 휴대폰을 어르신용(놀이)으로 바꾸기</button>
    <button class="big-btn" data-a="home">돌아가기</button>`);
  $('#chg').onclick=()=>famJoin();
  const seg=(id,get,set)=>{const box=$(id);if(!box)return;
    const paint=()=>box.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===String(get())));
    box.querySelectorAll('button').forEach(b=>b.onclick=()=>{set(b.dataset.v);save();paint();tick()});paint()};
  seg('#fs',()=>S.fs,v=>{S.fs=+v;applyFont()});
  const re=async()=>{const ok=await setupFamAlarm(true);S.fam.asked=true;save();const m=$('#fmsg');if(m)m.textContent=ok?(S.fam.remind?`매일 저녁 ${S.fam.hour-12}시에 알려 드려요.`:'알림을 껐어요.'):'알림 권한이 꺼져 있어요. 휴대폰 설정에서 허용해 주세요.'};
  seg('#fr',()=>S.fam.remind?1:0,v=>{S.fam.remind=v==='1';re()});
  seg('#fh',()=>S.fam.hour,v=>{S.fam.hour=+v;re()});
  let ar=false;const tg=$('#tog');
  tg.onclick=()=>{if(!ar){ar=true;tg.textContent='정말 바꿀까요? 한 번 더 누르세요';return}S.role='grandma';save();home()};
}
/* =========================================================
   연결
   ========================================================= */
const ACTIONS={famSettings,alarmOn:turnOnAlarms,evidence,home,start:startSession,records,settings,check:startCheck,checkResult:()=>checkResult(false),things};
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(b&&ACTIONS[b.dataset.a]){tick();ACTIONS[b.dataset.a]()}
});
window.__bw={play:k=>{RUN++;GAMES[k].run(r=>result(r));},S:()=>S};
SES={list:[{k:'speed'}],i:0};
applyFont();
home();
if(S.link.pending)trySync();
if(NATIVE){
  if(S.role==='grandma'&&S.alarm.asked)setupAlarms(false);
  if(S.role==='family'&&S.fam.asked)setupFamAlarm(false);
  try{PL.App&&PL.App.addListener('backButton',()=>{if(ON_HOME){PL.App.minimizeApp&&PL.App.minimizeApp()}else home()})}catch(e){}
  try{PL.App&&PL.App.addListener('resume',()=>{if(S.link.pending)trySync();if(ON_HOME)home()})}catch(e){}
}
})();
</script>
